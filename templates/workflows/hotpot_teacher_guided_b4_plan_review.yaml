id: hotpot_teacher_guided_b4_plan_review
name: "HotpotQA Teacher-Guided Agent, B=4 + plan review"
description: "Optional preflight plan review, then 4 teacher-guided action steps."
reasoning_style: teacher_guided

components:
  - type: teacher_guided_plan_review
    config: {enabled: true}
  - type: teacher_guided_agent_step
    config: {step_index: 1, budget: 4, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 2, budget: 4, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 3, budget: 4, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 4, budget: 4, force_finish: true}

config:
  max_steps: 5  # plan review + 4 action steps
