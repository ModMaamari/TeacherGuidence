id: hotpot_tg_b5_g3_plan_review_openrouter
name: "HotpotQA Teacher Guidance B=5 G=3 + plan review (OpenRouter)"
mode: standard

# OpenRouter is OpenAI-compatible, so we use the built-in `custom` provider.
# Models are prefixed with `custom/`; the endpoint + key come from .env:
#   CUSTOM_LLM_ENDPOINT=https://openrouter.ai/api
#   CUSTOM_LLM_API_KEY=sk-or-v1-...
# teacher_models[0] only sets the default client model; the actual per-call models
# come from mode_config.student_model / mode_config.teacher_model below.
teacher_models:
  - name: student
    model_id: custom/qwen/qwen3.7-plus
    role: teacher
    temperature: 0.2

consultant_models: []

workflows:
  - hotpot_teacher_guided_b5_plan_review

datasets:
  - name: hotpot_questions
    path: ./data/datasets/hotpot_teacher_guidance/hotpot_distractor_validation_questions.jsonl
    num_samples: 10
    sample_strategy: sequential

max_iterations: 1
similarity_metric: token_overlap
similarity_threshold: 0.0

verification:
  enabled: false

mode_config:
  budget: 5
  student_model: custom/qwen/qwen3.7-plus
  teacher_model: custom/z-ai/glm-5.2
  corpus_path: ./data/datasets/hotpot_teacher_guidance/hotpot_distractor_validation_corpus.jsonl
  retrieval_backend: hotpot_local

  guidance:
    level: 3
    name: diagnostic_feedback
    score_mode: continuous
    max_feedback_words: 60
    expose_next_action_hint: false
    expose_tool_hint: false
    expose_query_hint: false
    expose_doc_title_hint: false
    expose_gold_answer_hint: false
    leak_policy: strict

  plan_review:
    enabled: true
    review_guidance_level: 3
    max_initial_plan_steps: 6
    max_revised_plan_steps: 6
    consume_budget: false
    include_revised_plan_in_student_context: true
    allow_teacher_to_suggest_tools: true
    allow_teacher_to_suggest_queries: false
    allow_teacher_to_reveal_gold_titles: false
    allow_teacher_to_reveal_gold_answer: false

output_dir: ./data/simulation_output/hotpot_tg_b5_g3_plan_review_openrouter
