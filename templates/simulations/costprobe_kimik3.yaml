id: costprobe_kimik3
name: FAU gpt-oss-120b teacher (fau/ibm-granite/granite-4.1-3b student, b=3)
mode: standard
teacher_models:
- name: student
  model_id: fau/ibm-granite/granite-4.1-3b
  role: teacher
  temperature: 0.2
consultant_models: []
workflows:
- hotpot_teacher_guided_b3_plan_review
datasets:
- name: hotpot_questions
  path: ./data/datasets/tg_smoke/hotpotqa/hotpotqa_validation_questions.jsonl
  num_samples: 5
  sample_strategy: sequential
max_iterations: 1
similarity_metric: token_overlap
similarity_threshold: 0.0
verification:
  enabled: false
mode_config:
  budget: 3
  student_model: fau/ibm-granite/granite-4.1-3b
  teacher_model: edenchat/qwen/kimi-k3
  teacher_router:
  - edenchat/qwen/kimi-k3
  student_use_response_schema: false
  disclose_budget: false
  wiki_enabled: false
  wiki_mode: tools
  corpus_path: ./data/datasets/tg_smoke/hotpotqa/hotpotqa_validation_corpus.jsonl
  retrieval_backend: hotpot_local
  skip_teacher: false
  teacher_max_tokens: 2500
  teacher_max_tokens_retry: 4000
  guidance:
    level: 3
    name: diagnostic_feedback
    score_mode: continuous
    max_feedback_words: 60
    expose_next_action_hint: false
    expose_tool_hint: false
    expose_query_hint: false
    expose_doc_title_hint: false
    expose_gold_answer_hint: false
    leak_policy: strict
  plan_review:
    enabled: true
    planner: student
    planning_steps: 3
    formal_plan: false
    review_guidance_level: 3
    max_initial_plan_steps: 6
    max_revised_plan_steps: 6
    consume_budget: false
    include_revised_plan_in_student_context: true
    allow_teacher_to_suggest_tools: true
    allow_teacher_to_suggest_queries: false
    allow_teacher_to_reveal_gold_titles: false
    allow_teacher_to_reveal_gold_answer: false
output_dir: ./data/simulation_output/costprobe/costprobe_kimik3
