<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher Guidance — Trajectory Explorer</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a light-mode flash.
    (function () {
      var t = localStorage.getItem("tg-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" title="All runs">
      <div class="brand-mark">TG</div>
      <div class="brand-text">
        <h1>Trajectory Explorer</h1>
        <span class="brand-sub">Teacher Guidance</span>
      </div>
    </a>

    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>

    <div class="topbar-controls">
      <label class="toggle" title="Reveal gold answers and the teacher's private diagnosis (never shown to the student).">
        <input type="checkbox" id="private-toggle" checked />
        <span>Teacher-private</span>
      </label>
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle light/dark theme">◐</button>
      <button id="refresh-btn" class="icon-btn" type="button" title="Reload data from disk">⟳</button>
    </div>
  </header>

  <main id="app"></main>

  <script src="/static/app.js"></script>
</body>
</html>
