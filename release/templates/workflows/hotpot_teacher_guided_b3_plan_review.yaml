id: hotpot_teacher_guided_b3_plan_review
name: "HotpotQA Teacher-Guided Agent, B=3 + plan review"
description: "Optional preflight plan review, then 3 teacher-guided action steps."
reasoning_style: teacher_guided

components:
  - type: teacher_guided_plan_review
    config: {enabled: true}
  - type: teacher_guided_agent_step
    config: {step_index: 1, budget: 3, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 2, budget: 3, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 3, budget: 3, force_finish: true}

config:
  max_steps: 4  # plan review + 3 action steps
