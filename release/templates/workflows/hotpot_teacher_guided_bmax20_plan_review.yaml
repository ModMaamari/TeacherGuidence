id: hotpot_teacher_guided_bmax20_plan_review
name: "HotpotQA Teacher-Guided Agent, hidden max B=20 + plan review"
description: >-
  Optional preflight plan review (planning budget set via mode_config.budget,
  independent of this file), then up to 20 teacher-guided action steps. Each
  step displays "budget 5" to the student/teacher (matching the planning
  budget) -- the real 20-step hard cap is never stated in any prompt. Used for
  the "does the student/teacher quietly run long when allowed to" ablation.
reasoning_style: teacher_guided

components:
  - type: teacher_guided_plan_review
    config: {enabled: true}
  - type: teacher_guided_agent_step
    config: {step_index: 1, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 2, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 3, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 4, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 5, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 6, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 7, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 8, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 9, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 10, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 11, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 12, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 13, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 14, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 15, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 16, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 17, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 18, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 19, budget: 5, force_finish: false}
  - type: teacher_guided_agent_step
    config: {step_index: 20, budget: 5, force_finish: true}

config:
  max_steps: 21  # plan review + up to 20 action steps
